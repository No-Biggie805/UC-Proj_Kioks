services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:6080"
    volumes:
      - .:/app
    environment:
      - DISPLAY=:0
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
